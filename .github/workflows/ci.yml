name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & GMS guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # Hard rule (CLAUDE.md / DESIGN.md §3): Fire OS has no Google Play Services, so no
      # dependency — direct or transitive — may pull GMS/Firebase/play-services. Fail the
      # build if any appears on the release runtime classpath.
      - name: GMS dependency guard
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt
          if grep -Eiq 'com\.google\.android\.gms|com\.google\.firebase|play-services' deps.txt; then
            echo "::error::Google Play Services / Firebase dependency detected — forbidden on Fire OS."
            grep -Ein 'com\.google\.android\.gms|com\.google\.firebase|play-services' deps.txt
            exit 1
          fi
          echo "No GMS/Firebase/play-services dependencies found."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    # The `secrets` context can't be used in a step `if:`, so surface it as an env flag here
    # (env values may reference secrets) and test that below.
    env:
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # If signing secrets are configured (via scripts/set-gh-secrets.sh), decode them and
      # point keystore.properties at the injected keystore. Otherwise the release build falls
      # back to the debug key (fine for sideload CI artifacts; see DESIGN.md §3). The keystore
      # is never committed — it lives only in these secrets and on the maintainer's machine.
      - name: Inject release keystore (if secret present)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci-release.keystore
          cat > keystore.properties <<EOF
          storeFile=ci-release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

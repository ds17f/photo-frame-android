<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Family Frame</title>
<style>
:root{color-scheme:dark;font:18px/1.3 Arial,sans-serif;color:#f6f4ef;background:transparent}
*{box-sizing:border-box}body{margin:0;padding:1.2vw;background:transparent}
@supports(font-size:clamp(16px,1.45vw,22px)){:root{font-size:clamp(16px,min(1.45vw,2.7vh),22px)}}
.layout{max-width:1600px;margin:auto;display:grid;gap:.65rem;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{min-width:0;background:rgba(15,21,31,.80);border:1px solid #ffffff2e;border-radius:16px;padding:.7rem .9rem}.wide{grid-column:1/-1}
h1,h2,h3,p{margin:0}h1{font-size:1.9rem;line-height:1.05}h2{font-size:1.12rem;color:#b9d5ff}h3{font-size:.73rem;letter-spacing:.08em;text-transform:uppercase;color:#b9d5ff}
.header{display:flex;align-items:center;justify-content:space-between;gap:1rem}.header .date{margin-top:.3rem}.muted{color:#c1c7d0;font-size:.75rem}.date{font-size:.76rem;color:#c1c7d0}.day-heading{display:flex;align-items:baseline;justify-content:space-between;gap:.4rem;flex-wrap:wrap}
.section{border-top:1px solid #ffffff24;margin-top:.5rem;padding-top:.45rem}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;margin-bottom:.25rem}.school-cycle{font-size:.75rem;font-weight:normal;letter-spacing:0;text-transform:none;color:#c1c7d0}
.entry{font-size:.9rem;margin:.25rem 0;overflow-wrap:anywhere}.section .entry:last-child{margin-bottom:0}.status{color:#ffdc94}.shoe{color:#ffdc94;font-weight:bold}
.lunch-choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.3rem .8rem;margin-top:.3rem}.lunch-choice{font-size:.83rem;line-height:1.25;overflow-wrap:anywhere;padding-left:.6rem;position:relative}.lunch-choice::before{content:'·';position:absolute;left:0;color:#b9d5ff}
.event{display:flex;gap:1rem;justify-content:space-between;padding:.2rem 0;font-size:.83rem}.event-date{white-space:nowrap;color:#c1c7d0}.upcoming h2{font-size:.9rem;margin-bottom:.2rem}.footer{font-size:.58rem;color:#c1c7d0}.footer p:empty{display:none}#error{color:#ffd3b9}a{color:#b9d5ff}[hidden]{display:none!important}
.weather-panel{flex:1;min-width:0}.weather-grid{display:flex;align-items:center;justify-content:flex-end;gap:.9rem}.weather-now{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:.6rem;row-gap:.1rem;min-width:0}.weather-location{grid-column:1/-1;font-size:.66rem;color:#c1c7d0}.conditions{grid-row:2/5;display:flex;align-items:center;gap:.2rem}.weather-temp{font-size:1.65rem;font-weight:bold;line-height:1.1;white-space:nowrap}.weather-icon{width:2.4rem;height:2.4rem;flex-shrink:0}.weather-description,.weather-range,.weather-detail{grid-column:2;font-size:.68rem}.weather-detail{font-size:.6rem;color:#c1c7d0}.forecast{display:flex;gap:.15rem}.forecast-day{display:flex;flex-direction:column;align-items:center;min-width:3rem;padding:0 .25rem;border-left:1px solid #ffffff24}.forecast-day .weather-icon{width:1.65rem;height:1.65rem}.forecast-label{font-size:.63rem;color:#c1c7d0}.forecast-range{font-size:.71rem;white-space:nowrap}.forecast-low{color:#b9d5ff}.forecast-precip{font-size:.55rem;color:#b9d5ff;white-space:nowrap}.weather-credit{display:flex;justify-content:flex-end;gap:.7rem;flex-wrap:wrap;font-size:.5rem;color:#c1c7d0;margin-top:.2rem}.weather-credit #weather-note{color:#ffdc94}.weather-credit #weather-note:empty{display:none}
@media(min-width:651px) and (max-width:1100px){.weather-now{column-gap:.35rem}.weather-grid{gap:.5rem}.weather-temp{font-size:1.4rem}.conditions .weather-icon{width:1.8rem;height:1.8rem}.forecast-day{min-width:2.7rem;padding:0 .2rem}.header{gap:.6rem}}
@media(min-width:651px) and (max-height:700px){body{padding:.8vw}.layout{gap:.5rem}.card{padding:.5rem .7rem}.section{margin-top:.35rem;padding-top:.3rem}.entry{margin:.18rem 0}.upcoming{display:none}}
@media(max-width:650px){body{padding:2vw}.layout{display:block}.card{margin-bottom:.65rem}.header{display:block}.weather-panel{margin-top:.7rem}.weather-grid{justify-content:space-between;flex-wrap:wrap}.weather-now{flex:1}.forecast{width:100%;justify-content:space-between}.forecast-day{min-width:0;flex:1}.forecast-day:first-child{border-left:0}.weather-credit{justify-content:flex-start}.lunch-choices{gap:.4rem .7rem}}
</style>
</head>
<body>
<main class="layout">
<section class="card wide header">
  <div><h1 id="clock">Family</h1><p id="date" class="date">Loading…</p></div>
  <div class="weather-panel"><div id="weather">Weather loading…</div><div class="weather-credit"><span id="weather-note"></span><span>Weather by <a href="https://open-meteo.com/">Open-Meteo</a></span></div></div>
</section>
<section class="card daily-card"><div class="day-heading"><h2>Today</h2><p class="date" id="today-date"></p></div><div id="today">Loading…</div></section>
<section class="card daily-card"><div class="day-heading"><h2>Tomorrow</h2><p class="date" id="tomorrow-date"></p></div><div id="tomorrow">Loading…</div></section>
<section class="card wide upcoming"><h2>Coming up</h2><div id="events"></div><p id="calendar-note" class="muted"></p></section>
<div class="wide footer"><p id="stamp"></p><p id="error" role="status"></p></div>
</main>
<script>
const put=(id,value)=>{document.getElementById(id).textContent=value;};
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function dateLabel(iso,weekday){const [y,m,d]=iso.split('-').map(Number);return `${weekday}, ${new Date(y,m-1,d).toLocaleDateString(undefined,{month:'long',day:'numeric'})}`;}
function eventTitle(event){return (event.time?event.time+' · ':'')+event.title;}
function section(box,title){const group=node('div','section');const heading=node('div','section-heading');heading.appendChild(node('h3','',title));group.appendChild(heading);box.appendChild(group);return group;}
function calendarEntries(box,group,empty){
  const rows=group.entries||[];
  rows.slice(0,3).forEach(event=>box.appendChild(node('p','entry',eventTitle(event))));
  if(rows.length>3)box.appendChild(node('p','muted',`${rows.length-3} more entries`));
  if(group.status==='loading'||group.status==='error'){box.appendChild(node('p','status entry',group.status==='loading'?'Loading calendar…':'Calendar unavailable'));return;}
  if(!rows.length)box.appendChild(node('p','muted',empty));
  if(group.status==='stale')box.appendChild(node('p','status muted','Calendar may be out of date'));
}
function renderSpecials(box,specials){
  if(specials.source==='calendar'){calendarEntries(box,specials,'No specials listed');return;}
  const schedule=specials.schedule||{};
  if(schedule.status==='no_school'){box.appendChild(node('p','entry','No school'));return;}
  if(schedule.status!=='school'){box.appendChild(node('p','muted','Specials not available'));return;}
  box.querySelector('.section-heading').appendChild(node('span','school-cycle','Day '+schedule.cycle_day));
  (schedule.children||[]).forEach(child=>{
    const row=node('div','entry');row.appendChild(node('strong','',child.name));
    row.appendChild(node('span','',child.status==='known'?' · '+(child.activity||'Activity not listed'):' · Activity not available'));
    if(child.sneakers===true)row.appendChild(node('span','shoe',' · Sneakers needed'));
    else if(child.sneakers===null||child.sneakers===undefined)row.appendChild(node('span','muted',' · Sneaker reminder unknown'));
    box.appendChild(row);
  });
}
function renderLunch(box,lunch){
  if(lunch.source==='calendar'){calendarEntries(box,lunch,'Lunch menu not listed');return;}
  if(lunch.school)box.appendChild(node('p','muted',lunch.school));
  if(lunch.status==='menu'){const choices=node('div','lunch-choices');(lunch.choices||lunch.summary.split('; ')).forEach(choice=>choices.appendChild(node('p','lunch-choice',choice)));box.appendChild(choices);}
  else if(lunch.status==='no_school')box.appendChild(node('p','entry',lunch.summary||'No school lunch'));
  else box.appendChild(node('p','muted','Menu not published for this date'));
}
function renderDay(target,day,calendars){
  const box=document.getElementById(target);box.textContent='';put(target+'-date',new Date(day.date+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}));
  // The API's date is already in the school timezone; do not use the device's day.
  const weekday=new Date(day.date+'T12:00:00Z').getUTCDay();
  if(weekday!==0&&weekday!==6){
    renderSpecials(section(box,'Specials'),day.specials||{source:'local',schedule:day.schedule});
    renderLunch(section(box,'Lunch'),day.lunch||{source:'local',status:'unknown'});
  }
  const other=section(box,'Other events');
  calendarEntries(other,{status:(calendars.events||{}).status,entries:day.events||[]},'No events listed');
}
function weatherIcon(code,isDay){
  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 64 64');svg.setAttribute('class','weather-icon');svg.setAttribute('aria-hidden','true');
  function draw(tag,attrs){const el=document.createElementNS(ns,tag);Object.keys(attrs).forEach(key=>el.setAttribute(key,String(attrs[key])));svg.appendChild(el);}
  function line(x1,y1,x2,y2,color,width){draw('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:color,'stroke-width':width||3,'stroke-linecap':'round'});}
  function sun(cx,cy,r){draw('circle',{cx:cx,cy:cy,r:r,fill:'#ffd166'});for(let i=0;i<8;i++){const a=i*Math.PI/4;line(cx+Math.cos(a)*(r+5),cy+Math.sin(a)*(r+5),cx+Math.cos(a)*(r+9),cy+Math.sin(a)*(r+9),'#ffd166',2.5);}}
  function moon(){draw('path',{d:'M36 10a21 21 0 1 0 18 31A22 22 0 0 1 36 10Z',fill:'#c7d9ff'});}
  function cloud(){draw('path',{d:'M18 45h29a10 10 0 0 0 0-20 15 15 0 0 0-28-3 12 12 0 0 0-1 23Z',fill:'#d1dbe8'});}
  function snow(cx,cy){for(let i=0;i<3;i++){const a=i*Math.PI/3;line(cx+Math.cos(a)*4,cy+Math.sin(a)*4,cx-Math.cos(a)*4,cy-Math.sin(a)*4,'#c7eaff',1.6);}}
  const known=typeof code==='number'&&[0,1,2,3,45,48,51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].indexOf(code)!==-1;
  if(!known){draw('circle',{cx:32,cy:32,r:20,fill:'none',stroke:'#c1c7d0','stroke-width':2,'stroke-dasharray':'3 5'});draw('path',{d:'M25 25c0-10 17-10 17 0 0 6-10 6-10 14',fill:'none',stroke:'#c1c7d0','stroke-width':3,'stroke-linecap':'round'});draw('circle',{cx:32,cy:46,r:2,fill:'#c1c7d0'});return svg;}
  if(code===0){if(isDay===false||isDay===0)moon();else sun(32,32,12);return svg;}
  if(code===1||code===2){if(isDay===false||isDay===0)moon();else sun(24,22,9);cloud();return svg;}
  cloud();
  if(code===45||code===48){[48,54,60].forEach(y=>line(12,y,53,y,'#b9c7d8',2.5));}
  else if([71,73,75,77,85,86].indexOf(code)!==-1){snow(21,55);snow(34,56);snow(47,55);}
  else if([95,96,99].indexOf(code)!==-1){draw('path',{d:'M31 41 23 53h9l-4 10 17-16h-10l4-6Z',fill:'#ffd166'});}
  else if([56,57,66,67].indexOf(code)!==-1){line(22,50,18,57,'#81c8ff',2.5);snow(40,55);}
  else if([51,53,55].indexOf(code)!==-1){[22,34,46].forEach(x=>draw('circle',{cx:x,cy:54,r:2,fill:'#81c8ff'}));}
  else if(code!==3){[22,34,46].forEach(x=>line(x,50,x-4,58,'#81c8ff',3));}
  return svg;
}
function degrees(value,unit){return typeof value==='number'&&Number.isFinite(value)?Math.round(value)+'°'+(unit?'F':''):'—';}
function weatherDate(data,weather){
  try{const parts=new Intl.DateTimeFormat('en',{timeZone:weather.forecast_timezone||data.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(data.generated_at)),values={};parts.forEach(part=>values[part.type]=part.value);return values.year+'-'+values.month+'-'+values.day;}catch(error){return data.today.date;}
}
function renderWeather(weather,data){
  const box=document.getElementById('weather');box.textContent='';put('weather-note','');
  if(!weather){box.appendChild(node('p','muted','Weather not configured'));return;}
  if(weather.status==='unavailable'){box.appendChild(node('p','muted',weather.error==='Loading weather'?'Loading weather…':'Weather unavailable'));return;}
  const today=weatherDate(data,weather),forecast=(weather.forecast||[]).filter(day=>day.date>=today).slice(0,5),todayForecast=forecast.find(day=>day.date===today);
  const observedToday=typeof weather.time==='string'&&weather.time.slice(0,10)===today;
  const high=todayForecast?todayForecast.high_f:(observedToday?weather.high_f:null),low=todayForecast?todayForecast.low_f:(observedToday?weather.low_f:null);
  const grid=node('div','weather-grid'),current=node('div','weather-now');current.appendChild(node('p','weather-location',weather.location||'Current weather'));
  const conditions=node('div','conditions');conditions.appendChild(weatherIcon(weather.weather_code,weather.is_day));conditions.appendChild(node('span','weather-temp',degrees(weather.temperature_f,true)));current.appendChild(conditions);
  current.appendChild(node('p','weather-description',weather.description||'Conditions unavailable'));
  current.appendChild(node('p','weather-range',`High ${degrees(high)} / Low ${degrees(low)}`));
  const wind=typeof weather.wind_mph==='number'&&Number.isFinite(weather.wind_mph)?Math.round(weather.wind_mph)+' mph':'—';
  current.appendChild(node('p','weather-detail',`Feels ${degrees(weather.apparent_temperature_f)} · Wind ${wind}`));grid.appendChild(current);
  if(forecast.length){const strip=node('div','forecast');strip.setAttribute('aria-label','Five-day weather forecast');
    const tomorrow=new Date(today+'T12:00:00Z');tomorrow.setUTCDate(tomorrow.getUTCDate()+1);const tomorrowISO=tomorrow.toISOString().slice(0,10);
    forecast.forEach(day=>{
      const card=node('div','forecast-day');card.setAttribute('role','group');card.setAttribute('aria-label',`${day.date}: ${day.description||'Conditions unavailable'}, high ${degrees(day.high_f)}, low ${degrees(day.low_f)}`);
      const label=day.date===today?'Today':day.date===tomorrowISO?'Tomorrow':new Date(day.date+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'});
      card.appendChild(node('p','forecast-label',label));card.appendChild(weatherIcon(day.weather_code,true));
      const range=node('div','forecast-range');range.appendChild(node('strong','',degrees(day.high_f)));range.appendChild(node('span','forecast-low',' / '+degrees(day.low_f)));card.appendChild(range);
      const probability=typeof day.precipitation_probability_max==='number'&&Number.isFinite(day.precipitation_probability_max)?Math.round(day.precipitation_probability_max)+'%':'—';card.appendChild(node('p','forecast-precip','Precip '+probability));strip.appendChild(card);
    });grid.appendChild(strip);
  }
  box.appendChild(grid);
  const notes=[];if(weather.stale)notes.push('Weather data is stale');if(weather.error)notes.push('Refresh failed');if(!forecast.length)notes.push('Forecast unavailable');put('weather-note',notes.join(' · '));
}
function renderUpcoming(data){
  const box=document.getElementById('events');box.textContent='';
  const upcoming=data.events.filter(event=>event.date>data.tomorrow.date);
  upcoming.slice(0,2).forEach(event=>{const row=node('div','event');row.appendChild(node('span','',eventTitle(event)));row.appendChild(node('span','event-date',event.date));box.appendChild(row);});
  if(!upcoming.length)box.appendChild(node('p','muted','No other upcoming events listed'));
  if(upcoming.length>2)box.appendChild(node('p','muted',`${upcoming.length-2} more events in the next 45 days`));
  const notices=[];const labels={specials:'Specials',lunch:'Lunch',events:'Events'};
  Object.keys(data.calendars||{}).forEach(kind=>{const feed=data.calendars[kind];if(feed.status==='error'||feed.status==='stale')notices.push(`${labels[kind]} calendar ${feed.status==='stale'?'may be out of date':'unavailable'}`);});
  put('calendar-note',notices.join(' · '));document.querySelector('.upcoming').hidden=!upcoming.length&&!notices.length;
}
function requestData(){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('GET','/api/data',true);xhr.timeout=15000;xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText);}catch(e){reject(new Error('Invalid dashboard response'));return;}resolve({ok:xhr.status>=200&&xhr.status<300,data:data,status:xhr.status});};xhr.onerror=()=>reject(new Error('Network error'));xhr.ontimeout=()=>reject(new Error('Request timed out'));xhr.send();});}
async function refresh(){
  try{
    const response=await requestData(),data=response.data;
    if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);
    const now=new Date(data.generated_at),calendars=data.calendars||{};
    put('clock',now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZone:data.timezone}));
    put('date',dateLabel(data.today.date,data.today.weekday));
    put('stamp',`Updated ${now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZone:data.timezone})} · ${data.timezone}`);
    renderDay('today',data.today,calendars);renderDay('tomorrow',data.tomorrow,calendars);renderWeather(data.weather,data);renderUpcoming(data);put('error','');
  }catch(error){
    put('today','Daily information unavailable');put('tomorrow','Daily information unavailable');put('events','Events unavailable');
    put('error',`Dashboard refresh failed: ${error.message}. Check the last update time above.`);
  }
}
refresh();setInterval(refresh,60000);
</script>
</body>
</html>
